# =============================================================================
# anspire-fde-hub 项目部署
# 基于 base image: myg133/openvscode-server:rust-bun-knodo
# 无 Dockerfile, 项目目录只有 compose + env 配置
# =============================================================================

services:
  openvscode-server:
    image: myg133/openvscode-server:rust-bun-knodo
    container_name: ocs-anspire-fde-hub
    restart: unless-stopped
    # host 端口不暴露, 外部访问全走 Traefik (fde-hub.localdev.anspire.cn)
    # 调试: docker exec -it ocs-anspire-fde-hub bash
    #       docker exec ocs-anspire-fde-hub curl 127.0.0.1:9910/health
    environment:
      - KNODO_INSTALL_URL=${KNODO_INSTALL_URL:-}
      - BACKEND_WS_URL=${BACKEND_WS_URL:-}
      - API_TOKEN=${API_TOKEN:-}
      - KNODO_AGENT_PORT=9910
      # === 清空 base image 继承的公司代理 (172.25.93.8:10808) ===
      # base image (myg133/openvscode-server:base-latest) 烤了 HTTP_PROXY 等 env,
      # 走公司代理到 knodo CDN 慢 (155 KB/s). 显式清空让 curl 直连 (1.12 MB/s, 7x 加速)
      # 大写 + 小写都要清 (curl 优先用小写)
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=localhost,127.0.0.1,anchnet.knodo.vip
      - no_proxy=localhost,127.0.0.1,anchnet.knodo.vip
    volumes:
      - knodo-state:/home/workspace/.knodo
      - project-data:/home/workspace/project
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fde-hub.rule=Host(`${OCS_HOST:?OCS_HOST required}`)"
      - "traefik.http.routers.fde-hub.entrypoints=websecure"
      - "traefik.http.routers.fde-hub.tls=true"
      - "traefik.http.services.fde-hub.loadbalancer.server.port=3000"
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  knodo-state:
    driver: local
    driver_opts:
      type: nfs
      o: addr=172.25.93.9,rw,sync,hard,intr,noatime
      device: ":/data-volumes/anspire-fde-hub/knodo"
  project-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=172.25.93.9,rw,sync,hard,intr,noatime
      device: ":/data-volumes/anspire-fde-hub/project"

networks:
  traefik-net:
    external: true
    name: traefik-net
