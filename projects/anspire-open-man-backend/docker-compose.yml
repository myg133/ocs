# =============================================================================
# anspire-open-man-backend 项目部署
# 基于 base image: myg133/openvscode-server:py-knodo
# 无 Dockerfile, 项目目录只有 compose + env 配置
# =============================================================================

services:
  openvscode-server:
    image: myg133/openvscode-server:python-knodo
    container_name: ocs-anspire-open-man-backend
    restart: unless-stopped
    # host 端口不暴露, 外部访问全走 Traefik (admin-backend.localdev.anspire.cn)
    # 调试: docker exec -it ocs-anspire-open-man-backend bash
    #       docker exec ocs-anspire-open-man-backend curl 127.0.0.1:9910/health
    environment:
      - KNODO_INSTALL_URL=${KNODO_INSTALL_URL:-}
      - BACKEND_WS_URL=${BACKEND_WS_URL:-}
      - API_TOKEN=${API_TOKEN:-}
      - KNODO_AGENT_PORT=9910
      # === 代理 env vars: 大写在 .env 配 (source of truth), 小写自动引用大写 ===
      # base image 烤了 HTTP_PROXY=http://172.25.93.8:10808 (公司代理,慢, 155 KB/s)
      # docker-compose 把 .env 注入的大写 env vars 直接覆盖 base image 烤的
      # 小写 (https_proxy) 用 ${HTTPS_PROXY} 引用大写, 大小写始终一致, curl 直连
      # 默认 .env 里 HTTPS_PROXY/HTTP_PROXY/NO_PROXY 都留空, 容器里 6 个 env vars 全是空 → 直连 (1.12 MB/s)
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - no_proxy=${NO_PROXY:-}
    volumes:
      - knodo-state:/home/workspace/.knodo
      - project-data:/home/workspace/project
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-backend.rule=Host(`${OCS_HOST:?OCS_HOST required}`)"
      - "traefik.http.routers.admin-backend.entrypoints=websecure"
      - "traefik.http.routers.admin-backend.tls=true"
      - "traefik.http.services.admin-backend.loadbalancer.server.port=3000"
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  knodo-state:
    driver: local
    driver_opts:
      type: nfs
      o: addr=172.25.93.9,rw,sync,hard,intr,noatime
      device: ":/data-volumes/anspire-open-man-backend/knodo"
  project-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=172.25.93.9,rw,sync,hard,intr,noatime
      device: ":/data-volumes/anspire-open-man-backend/project"

networks:
  traefik-net:
    external: true
    name: traefik-net
