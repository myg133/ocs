# =============================================================================
# OCS + knodo 本地测试用 docker-compose (rust + bun/svelte 变体)
#
# ⚠️ 路径说明: 如果你的 docker daemon 在远端 (本机只是 CLI), 那下面所有 bind mount
# 路径都是 daemon 端的路径, 不是 Windows 端的。最简单办法: 不挂项目目录, 进 openvscode
# 终端 git clone。knodo 状态用 named volume 持久化, 不受路径影响。
#
# 用法:
#   cp .env.example .env
#   vi .env            # 填 KNODO_INSTALL_URL 或 BACKEND_WS_URL+API_TOKEN
#   docker compose up -d
#   docker compose logs -f
#   浏览器: http://localhost:3002   (默认, 跟 python-knodo/njs-knodo 错开)
#
# 验证:
#   curl http://localhost:9912/health
#   docker compose exec openvscode-server bash /usr/local/bin/test-knodo-integration.sh
# =============================================================================

services:
  openvscode-server:
    image: myg133/openvscode-server:rust-bun-knodo
    container_name: ocs-rust-bun-knodo
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${OVSS_HOST_PORT:-3002}:3000"   # openvscode-server web UI
      - "${KNODO_HOST_PORT:-9912}:9910"  # knodo-agent 健康/管理
    environment:
      # ---- knodo 凭证 (entrypoint.sh 三选一, 默认只用第 1 个) ----
      # 路径 1: 首次激活 (24h 有效, 激活后写到 named volume, 后续自动复用)
      - KNODO_INSTALL_URL=${KNODO_INSTALL_URL:-}
      # 路径 2: 长期凭证 (只在 named volume 丢失时需要手动填, 见 .env.example)
      - BACKEND_WS_URL=${BACKEND_WS_URL:-}
      - API_TOKEN=${API_TOKEN:-}
      # 通用
      - KNODO_AGENT_PORT=9910
      # 可选代理
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
    volumes:
      # knodo 状态 (NFS, 替代原 named volume)
      - rust-bun-knodo-knodo:/home/workspace/.knodo
      # 项目代码 (NFS, 172.25.93.9:/data-volumes, 备用)
      - rust-bun-knodo-project:/home/workspace/project
    # ---- Traefik 路由 ----
    # RUST_BUN_KNODO_HOST 在 .env 里设, 例: fde-hub.localdev.anspire.cn
    # 证书用 traefik.yml 里的 tls.certificates 静态加载 (acme.sh 签的 *.localdev.anspire.cn)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rust-bun-knodo-ovss.rule=Host(`${RUST_BUN_KNODO_HOST:?RUST_BUN_KNODO_HOST required}`)"
      - "traefik.http.routers.rust-bun-knodo-ovss.entrypoints=websecure"
      - "traefik.http.routers.rust-bun-knodo-ovss.tls=true"
      - "traefik.http.services.rust-bun-knodo-ovss.loadbalancer.server.port=3000"
      - "traefik.http.routers.rust-bun-knodo-ovss.middlewares=secure-headers@file"
    networks:
      - traefik-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  rust-bun-knodo-knodo:
    driver: local
    driver_opts:
      type: nfs
      o: addr=172.25.93.9,rw,sync,hard,intr,noatime
      device: ":/data-volumes/rust-bun-knodo/knodo"
  rust-bun-knodo-project:
    driver: local
    driver_opts:
      type: nfs
      o: addr=172.25.93.9,rw,sync,hard,intr,noatime
      device: ":/data-volumes/rust-bun-knodo/project"

networks:
  traefik-net:
    external: true
    name: traefik-net
